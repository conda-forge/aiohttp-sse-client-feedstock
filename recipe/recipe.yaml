schema_version: 1

context:
  name: aiohttp-sse-client
  version: "0.2.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 5004e29271624af586158dc7166cb0687a7a5997aab5b808f4b53400e1b72e3b

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pytest-runner
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiohttp >=3
    - attrs
    - multidict
    - yarl

tests:
  - python:
      imports:
        - aiohttp_sse_client
      pip_check: false
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Server-Sent Event python client library base on aiohttp
  description: |
    Server-Sent Event python client library base on aiohttp
  homepage: https://github.com/rtfol/aiohttp-sse-client
  repository: https://github.com/rtfol/aiohttp-sse-client
  documentation: https://aiohttp-sse-client.readthedocs.io/en/latest/?badge=latest

extra:
  recipe-maintainers:
    - timkpaine
